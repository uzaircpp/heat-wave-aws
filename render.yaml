# One-click deploy on Render (https://render.com). Free web service + free Postgres.
services:
  - type: web
    name: urbanshield
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OFFICER_TOKEN
        generateValue: true
      - key: CONTACT_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: urbanshield-db
          property: connectionString
databases:
  - name: urbanshield-db
    plan: free
